name: Group 6 Assignment 2 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_and_test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        ros_distro: [jazzy]

    steps:
      # 1. Checkout your code first
      - uses: actions/checkout@v4
        with:
          path: ros_ws/src/group_6_assignment_2

      # 2. Setup ROS 2 Jazzy environment 
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.ros_distro }}

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          cd ros_ws
          # Ensure rosdep is initialized (setup-ros usually does this, but this is a safe backup)
          sudo rosdep init || true
          rosdep update
          rosdep install --from-paths src --ignore-src -y --rosdistro ${{ matrix.ros_distro }}

      # 4. Build with explicit sourcing
      - name: Build
        run: |
          # This is the fix: manually source the ROS setup before running colcon
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          cd ros_ws
          colcon build --event-handlers console_direct+ --symlink-install
