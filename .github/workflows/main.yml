name: Group 6 Assignment 2 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_and_test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        ros_distro: [jazzy]

    steps:
      # Setup ROS 2 Jazzy environment
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.ros_distro }}

      # Checkout your code into the correct workspace structure
      - uses: actions/checkout@v4
        with:
          # This creates ros_ws/src/group_6_assignment_2 and puts your repo there
          path: ros_ws/src/group_6_assignment_2

      # Install dependencies (reads the package.xml you edited)
      - name: Install dependencies
        run: |
          cd ros_ws
          rosdep update
          # This looks into 'src', finds your package.xml, and installs the list we made
          rosdep install --from-paths src --ignore-src -y --rosdistro ${{ matrix.ros_distro }}

      # Build
      - name: Build
        run: |
          cd ros_ws
          colcon build --symlink-install